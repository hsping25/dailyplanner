// ── 그림 메모: 손가락/펜으로 캔버스에 그려 PNG로 저장 ──
const drawModal = document.getElementById("draw-modal");
const dCanvas = document.getElementById("draw-canvas");
const dCtx = dCanvas.getContext("2d");
const penBtn = document.getElementById("draw-pen");
const eraserBtn = document.getElementById("draw-eraser");
let drawMemoId = null;   // 수정 중인 메모 id (새 그림이면 null)
let drawTool = "pen";
let drawing = false;
let undoStack = [];      // 획 시작 전 화면 스냅샷 (최대 20개)
let penSeen = false;     // 펜(스타일러스)이 한 번이라도 감지되면 true → 팜 리젝션 켜짐
let activePointer = null; // 지금 그리는 포인터 id (동시에 여러 손가락 무시)
let activeType = null;    // 그 포인터 종류 (pen/touch/mouse)

function setTool(t) {
  drawTool = t;
  penBtn.classList.toggle("on", t === "pen");
  eraserBtn.classList.toggle("on", t === "eraser");
}
penBtn.onclick = () => setTool("pen");
eraserBtn.onclick = () => setTool("eraser");

function fillWhite() {
  dCtx.save();
  dCtx.setTransform(1, 0, 0, 1, 0, 0);
  dCtx.fillStyle = "#fff";
  dCtx.fillRect(0, 0, dCanvas.width, dCanvas.height);
  dCtx.restore();
}

function openDraw(memoId, src) {
  drawMemoId = memoId ?? null;
  drawModal.hidden = false;
  setTool("pen");
  undoStack = [];
  penSeen = false;       // 새로 열 때마다 팜 리젝션 초기화 (펜 감지 전엔 손가락 허용)
  activePointer = null;
  activeType = null;
  // 화면 크기에 맞춰 캔버스 해상도 설정 (선명하게 dpr 배율)
  const rect = dCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  dCanvas.width = Math.round(rect.width * dpr);
  dCanvas.height = Math.round(rect.height * dpr);
  dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dCtx.lineCap = "round";
  dCtx.lineJoin = "round";
  fillWhite();
  if (src) {  // 기존 그림 이어서: 비율 유지하며 캔버스에 맞춰 그림
    const img = new Image();
    img.onload = () => {
      const s = Math.min(rect.width / img.width, rect.height / img.height);
      dCtx.drawImage(img, (rect.width - img.width * s) / 2, (rect.height - img.height * s) / 2,
        img.width * s, img.height * s);
    };
    img.src = src;
  }
}
function closeDraw() { drawModal.hidden = true; }

function pushUndo() {
  if (undoStack.length >= 20) undoStack.shift();
  undoStack.push(dCtx.getImageData(0, 0, dCanvas.width, dCanvas.height));
}
document.getElementById("draw-undo").onclick = () => {
  const snap = undoStack.pop();
  if (snap) dCtx.putImageData(snap, 0, 0);
};
document.getElementById("draw-clear").onclick = () => { pushUndo(); fillWhite(); };
document.getElementById("draw-cancel").onclick = closeDraw;
document.getElementById("draw-save").onclick = async () => {
  const data = dCanvas.toDataURL("image/png");
  if (drawMemoId) {
    await apiFetch(`/api/memos/${drawMemoId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: data }),
    });
  } else {
    await apiFetch("/api/memos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: data, kind: "draw" }),
    });
  }
  closeDraw();
  loadMemos();
};
document.getElementById("memo-draw-new").onclick = () => openDraw(null, null);

// 이 포인터로 그릴지 판단 (팜 리젝션)
// - 펜/마우스는 항상 허용. 펜을 한 번이라도 쓰면 penSeen=true.
// - penSeen이면 손가락(touch)은 손바닥으로 보고 무시 → 펜으로 그릴 때 손바닥 오작동 방지.
// - 펜을 안 쓰는 사람은 penSeen이 계속 false라 손가락 그리기가 그대로 된다.
function acceptPointer(type) {
  if (type === "pen") { penSeen = true; return true; }
  if (type === "mouse") return true;
  return !penSeen; // touch
}

// 포인터(손가락·펜·마우스 공통)로 선 긋기
dCanvas.addEventListener("pointerdown", ev => {
  if (!acceptPointer(ev.pointerType)) return; // 손바닥/여분 손가락 무시
  if (activePointer !== null) {
    // 손가락으로 그리던 중 펜이 닿으면: 손가락 획(손바닥)을 되돌리고 펜이 이어받는다
    if (ev.pointerType === "pen" && activeType === "touch") {
      const snap = undoStack.pop();
      if (snap) dCtx.putImageData(snap, 0, 0);
    } else {
      return; // 그 밖의 겹친 포인터는 무시
    }
  }
  ev.preventDefault();
  activePointer = ev.pointerId;
  activeType = ev.pointerType;
  dCanvas.setPointerCapture(ev.pointerId);
  pushUndo();
  drawing = true;
  dCtx.strokeStyle = drawTool === "pen" ? "#111" : "#fff";
  dCtx.lineWidth = drawTool === "pen" ? 3 : 26;
  dCtx.beginPath();
  dCtx.moveTo(ev.offsetX, ev.offsetY);
  dCtx.lineTo(ev.offsetX + 0.01, ev.offsetY + 0.01); // 점 하나만 찍어도 보이게
  dCtx.stroke();
});
dCanvas.addEventListener("pointermove", ev => {
  if (!drawing || ev.pointerId !== activePointer) return;
  // 브라우저가 합쳐 놓은 중간 좌표까지 그려서 빠른 획도 부드럽게
  const events = ev.getCoalescedEvents?.() ?? [ev];
  for (const e of events) { dCtx.lineTo(e.offsetX, e.offsetY); }
  dCtx.stroke();
});
const endStroke = ev => {
  if (ev.pointerId !== activePointer) return;
  drawing = false;
  activePointer = null;
  activeType = null;
};
dCanvas.addEventListener("pointerup", endStroke);
dCanvas.addEventListener("pointercancel", endStroke);

// ── 타이머: 일반 + 포모도로 (시작/일시정지/중지) ──
// 목표 종료 시각(tmEndAt)을 기준으로 매 틱마다 남은 시간을 계산한다.
// 이렇게 하면 폰이 잠들어 setInterval이 밀려도 깨어나면 정확히 맞는다.
const tmSimpleBtn = document.getElementById("tm-simple");
const tmPomoBtn = document.getElementById("tm-pomo");
const tmSimplePanel = document.getElementById("tm-simple-panel");
const tmPomoPanel = document.getElementById("tm-pomo-panel");
const tmMinEl = document.getElementById("tm-min");
const tmSecEl = document.getElementById("tm-sec");
const tmFocusEl = document.getElementById("tm-focus");
const tmBreakEl = document.getElementById("tm-break");
const tmPhaseEl = document.getElementById("tm-phase");
const tmTimeEl = document.getElementById("tm-time");
const tmStartBtn = document.getElementById("tm-start");
const tmPauseBtn = document.getElementById("tm-pause");
const tmStopBtn = document.getElementById("tm-stop");

let tmMode = localStorage.getItem("timer_mode") || "simple";
let tmState = "idle";   // idle | running | paused
let tmPhase = "focus";  // 포모도로 단계: focus | break
let tmEndAt = 0;        // 실행 중일 때 목표 종료 시각(ms)
let tmRemain = 0;       // 일시정지 중일 때 남은 ms
let tmInterval = null;

// 저장된 설정 복원
tmMinEl.value = localStorage.getItem("timer_min") ?? "10";
tmSecEl.value = localStorage.getItem("timer_sec") ?? "0";
tmFocusEl.value = localStorage.getItem("timer_focus") ?? "25";
tmBreakEl.value = localStorage.getItem("timer_break") ?? "5";

const clampNum = (v, lo, hi, def) => Math.max(lo, Math.min(hi, Number.isFinite(+v) && v !== "" ? Math.floor(+v) : def));
const simpleMs = () => (clampNum(tmMinEl.value, 0, 180, 0) * 60 + clampNum(tmSecEl.value, 0, 59, 0)) * 1000;
const focusMs = () => clampNum(tmFocusEl.value, 1, 180, 25) * 60000;
const breakMs = () => clampNum(tmBreakEl.value, 1, 60, 5) * 60000;
const phaseMs = () => tmMode === "simple" ? simpleMs() : (tmPhase === "focus" ? focusMs() : breakMs());

function fmtDur(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
}
function renderTimer(ms, done = false) {
  tmTimeEl.textContent = fmtDur(ms);
  tmTimeEl.classList.toggle("done", done);
  const showPhase = tmMode === "pomo" && tmState !== "idle";
  tmPhaseEl.hidden = !showPhase;
  tmPhaseEl.textContent = tmPhase === "focus" ? "집중" : "휴식";
  tmPhaseEl.classList.toggle("break", tmPhase === "break");
}
function updateTimerControls() {
  tmStartBtn.hidden = tmState === "running";
  tmStartBtn.textContent = tmState === "paused" ? "계속" : "시작";
  tmPauseBtn.hidden = tmState !== "running";
  tmStopBtn.hidden = tmState === "idle";
  const lock = tmState !== "idle"; // 실행/일시정지 중엔 설정 잠금
  [tmMinEl, tmSecEl, tmFocusEl, tmBreakEl, tmSimpleBtn, tmPomoBtn].forEach(el => el.disabled = lock);
}

function setTimerMode(m) {
  tmMode = m;
  tmSimpleBtn.classList.toggle("on", m === "simple");
  tmPomoBtn.classList.toggle("on", m === "pomo");
  tmSimplePanel.hidden = m !== "simple";
  tmPomoPanel.hidden = m !== "pomo";
  localStorage.setItem("timer_mode", m);
  resetTimer(); // 모드를 바꾸면 초기화
}
function saveTimerSettings() {
  localStorage.setItem("timer_min", tmMinEl.value);
  localStorage.setItem("timer_sec", tmSecEl.value);
  localStorage.setItem("timer_focus", tmFocusEl.value);
  localStorage.setItem("timer_break", tmBreakEl.value);
}

function timerTick() {
  const left = tmEndAt - Date.now();
  if (left <= 0) { onTimerComplete(); return; }
  renderTimer(left);
}
function runFrom(ms) {
  if (ms <= 0) return;
  tmEndAt = Date.now() + ms;
  tmState = "running";
  clearInterval(tmInterval);
  tmInterval = setInterval(timerTick, 200);
  updateTimerControls();
  renderTimer(ms);
}
function onTimerComplete() {
  clearInterval(tmInterval);
  beepTimer();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  const finishedFocus = tmMode === "simple" || tmPhase === "focus";
  if (finishedFocus) creditFocus(Math.round(phaseMs() / 60000));
  if (tmMode === "pomo") {
    // 집중 ↔ 휴식 자동 전환, 계속 반복 (중지 전까지)
    tmPhase = tmPhase === "focus" ? "break" : "focus";
    runFrom(phaseMs());
  } else {
    tmState = "idle";
    updateTimerControls();
    renderTimer(0, true);
  }
  if (finishedFocus) askTargetDone();
}
function resetTimer() {
  clearInterval(tmInterval);
  tmState = "idle";
  tmPhase = "focus";
  updateTimerControls();
  renderTimer(phaseMs());
}

// ── 타이머 ↔ 할 일 ── 무엇에 대한 25분인지 앱이 알면, 그 시간이 기록으로 쌓인다.
const tmTargetEl = document.getElementById("tm-target");
let tmTaskId = null, tmTaskTitle = "";
function renderTimerTarget() {
  tmTargetEl.hidden = !tmTaskId;
  if (!tmTaskId) return;
  tmTargetEl.innerHTML = `<span class="name">⏱ ${esc(tmTaskTitle)}</span><span class="x" id="tm-unlink">✕</span>`;
  document.getElementById("tm-unlink").onclick = () => { tmTaskId = null; renderTimerTarget(); };
}
function creditFocus(minutes) {
  if (!tmTaskId || minutes <= 0) return;
  apiFetch(`/api/tasks/${tmTaskId}/focus`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ minutes }),
  }).catch(() => {});
}
// 집중이 끝나면 그 자리에서 완료 여부를 묻는다 (물어보지 않으면 체크는 영영 안 된다)
async function askTargetDone() {
  if (!tmTaskId) return;
  const id = tmTaskId, title = tmTaskTitle;
  if (!confirm(`"${title}" — 끝났나요?\n확인을 누르면 완료로 표시해요.`)) return;
  await apiFetch(`/api/tasks/${id}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ done: true }),
  }).catch(() => {});
  tmTaskId = null;
  renderTimerTarget();
  loadDay(viewDate);
}
// 할 일의 ▶ → 타이머 뷰로 넘어가며 그 할 일을 걸고 바로 시작
function startTimerFor(id) {
  const t = taskById.get(id);
  if (!t) return;
  if (tmState !== "idle" && !confirm("타이머가 돌고 있어요. 새로 시작할까요?")) return;
  resetTimer();
  tmTaskId = id;
  tmTaskTitle = t.title;
  renderTimerTarget();
  showView("timer");
  ensureAudio();
  if (tmMode === "pomo") tmPhase = "focus";
  runFrom(phaseMs());
}

// 완료 알림음 (짧게 두 번). 시작 버튼(사용자 제스처)에서 오디오를 미리 깨워 둔다.
let audioCtx = null;
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch {}
}
function beepTimer() {
  if (!audioCtx) return;
  try {
    const base = audioCtx.currentTime;
    for (const off of [0, 0.28]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, base + off);
      g.gain.exponentialRampToValueAtTime(0.35, base + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, base + off + 0.22);
      o.start(base + off); o.stop(base + off + 0.24);
    }
  } catch {}
}

tmSimpleBtn.onclick = () => { if (tmState === "idle") setTimerMode("simple"); };
tmPomoBtn.onclick = () => { if (tmState === "idle") setTimerMode("pomo"); };

tmStartBtn.onclick = () => {
  ensureAudio();
  if (tmState === "paused") {
    runFrom(tmRemain);
  } else {
    if (tmMode === "pomo") tmPhase = "focus";
    runFrom(phaseMs());
  }
};
tmPauseBtn.onclick = () => {
  if (tmState !== "running") return;
  tmRemain = Math.max(0, tmEndAt - Date.now());
  tmState = "paused";
  clearInterval(tmInterval);
  updateTimerControls();
};
tmStopBtn.onclick = () => {
  // 중지 전까지 흘러간 집중 시간도 기록에 남긴다 (25분을 다 못 채워도 한 건 한 거니까)
  if (tmMode === "simple" || tmPhase === "focus") {
    const elapsed = phaseMs() - (tmState === "paused" ? tmRemain : Math.max(0, tmEndAt - Date.now()));
    creditFocus(Math.floor(elapsed / 60000));
  }
  resetTimer();
  tmTaskId = null;
  renderTimerTarget();
};

// 프리셋(1·3·5·10·25분) 탭
tmSimplePanel.querySelector(".tm-presets").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-min]");
  if (!b || tmState !== "idle") return;
  tmMinEl.value = b.dataset.min;
  tmSecEl.value = "0";
  saveTimerSettings();
  renderTimer(simpleMs());
});
// 설정 입력 → 저장하고 대기 화면 갱신
[tmMinEl, tmSecEl].forEach(el => el.addEventListener("input", () => {
  saveTimerSettings();
  if (tmState === "idle" && tmMode === "simple") renderTimer(simpleMs());
}));
[tmFocusEl, tmBreakEl].forEach(el => el.addEventListener("input", () => {
  saveTimerSettings();
  if (tmState === "idle" && tmMode === "pomo") renderTimer(phaseMs());
}));

setTimerMode(tmMode); // 초기 모드 + 대기 화면

// ── 이번 주 점(목록 모드 하단): 날짜 탭 = 그날로 이동, 호버 = 미리보기 ──
const weekEl = document.getElementById("week");
const weekTitleEl = document.getElementById("week-title");
const popEl = document.getElementById("week-pop");

function renderWeekStrip() {
  weekEl.innerHTML = weekData.map((day, i) => {
    const o = dateObj(day.date);
    const cls = ["day",
      day.date === viewDate ? "sel" : "",
      day.date === todayStr ? "today" : "",
      day.date < todayStr ? "past-day" : ""].join(" ");
    const dots = day.items.slice(0, 5).map(it => {
      const mod = it.kind === "task" ? " todo" : (it.recurring ? " rec" : "");
      return `<span class="dot${mod}"></span>`;
    }).join("");
    // 달성률 고리: 계획이 있었던 날에만. 닫은 날은 테두리에 옅은 링을 하나 더.
    const s = scoreOf(day.date);
    const pct = s && s.planned ? Math.round((s.done / s.planned) * 100) : 0;
    const ringCls = ["ring", !s || !s.planned ? "none" : "", pct >= 100 ? "full" : "", s?.closed ? "closed" : ""].join(" ");
    const ring = `<span class="${ringCls}" style="--pct:${pct}"></span>`;
    return `<div class="${cls}" data-i="${i}" data-date="${day.date}">
      <div class="dots">${dots}</div>${ring}<div class="label">${DAY_NAMES[(i + 1) % 7]}<br>${o.getDate()}</div></div>`;
  }).join("");
  const hasToday = weekData.some(d => d.date === todayStr);
  const f = weekData[0].date.split("-"), l = weekData[6].date.split("-");
  weekTitleEl.textContent = hasToday ? "이번 주" : `${+f[1]}/${+f[2]} ~ ${+l[1]}/${+l[2]}`;
}

function openPop(i) {
  const day = weekData[i], o = dateObj(day.date);
  const title = `${o.getMonth() + 1}월 ${o.getDate()}일 ${DAY_NAMES[o.getDay()]}요일`;
  const items = day.items.map(it => {
    if (it.kind === "task") return `<div class="wp-item"><span class="wp-time">할 일</span>${esc(it.title)}</div>`;
    if (it.allday) return `<div class="wp-item"><span class="wp-time">종일</span>${esc(it.title)}</div>`;
    const t = new Date(it.start);
    return `<div class="wp-item${it.recurring ? " recurring" : ""}"><span class="wp-time">${fmtTime(t)}</span>${esc(it.title)}</div>`;
  }).join("");
  const s = scoreOf(day.date);
  const score = s?.planned ? `<div class="wp-item"><span class="wp-time">${s.done}/${s.planned}</span>${
    s.starPlanned ? `핵심 ${s.starDone}/${s.starPlanned}` : "달성"}</div>` : "";
  const note = s?.note ? `<div class="wp-item"><span class="wp-time">회고</span>${esc(s.note)}</div>` : "";
  popEl.innerHTML = `<div class="wp-title">${title}</div>` + score + (items || `<div class="wp-empty">일정 없음</div>`) + note;
  popEl.hidden = false;
}
function closePop() { popEl.hidden = true; }

weekEl.addEventListener("click", ev => {
  const el = ev.target.closest(".day");
  if (el) { ev.stopPropagation(); closePop(); loadDay(el.dataset.date); }
});
weekEl.addEventListener("mouseover", ev => {
  const el = ev.target.closest(".day");
  if (el) openPop(Number(el.dataset.i));
});
weekEl.addEventListener("mouseleave", closePop);
document.addEventListener("click", closePop);

// ── 첫 렌더 ──
setWtMode(wtMode);
renderAll();
showView(localStorage.getItem("view") || "list");

// ───────── 채팅 입력 → 파싱 → 확인 후 등록 ─────────
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
const chatPanel = document.getElementById("chat-panel");
let chatHistory = [];  // 되묻기 흐름 유지용
let pendingItems = null;

function fmtWhen(it) {
  if (it.kind === "task") {
    return it.due ? `${Number(it.due.slice(5, 7))}/${Number(it.due.slice(8, 10))}까지` : "기한 없음";
  }
  const s = new Date(it.start);
  const day = `${s.getMonth() + 1}/${s.getDate()} (${DAY_NAMES[s.getDay()]})`;
  if (it.allday) return `${day} 종일`;
  const e = new Date(it.end);
  return `${day} ${fmtTime(s)}–${fmtTime(e)}`;
}

// RRULE을 사람이 읽을 문구로 (자주 쓰는 패턴만)
function fmtRrule(rrule) {
  if (!rrule) return "";
  const byday = { MO: "월", TU: "화", WE: "수", TH: "목", FR: "금", SA: "토", SU: "일" };
  if (/FREQ=DAILY/.test(rrule)) return "매일 반복";
  if (/FREQ=WEEKLY/.test(rrule)) {
    const m = rrule.match(/BYDAY=([A-Z,]+)/);
    const days = m ? m[1].split(",").map(d => byday[d] ?? d).join("·") : "";
    return days ? `매주 ${days} 반복` : "매주 반복";
  }
  if (/FREQ=MONTHLY/.test(rrule)) return "매달 반복";
  return `반복: ${rrule}`;
}

function chatReset() {
  chatHistory = [];
  pendingItems = null;
  chatPanel.innerHTML = "";
}

function renderConfirm(items) {
  pendingItems = items;
  const rows = items.map(it => {
    const label = it.kind === "task" ? "할 일" : "";
    const rep = it.kind === "event" && it.rrule ? `<span class="cp-rep">${fmtRrule(it.rrule)}</span>` : "";
    return `<div class="cp-item${it.rrule ? " recurring" : ""}">
      <span class="cp-when">${label ? label + " · " : ""}${fmtWhen(it)}</span>${it.title} ${rep}
    </div>`;
  }).join("");
  chatPanel.innerHTML = `<div class="cp-card">
    <div class="cp-head">이렇게 넣을게요</div>${rows}
    <div id="cp-warns"></div>
    <div class="cp-btns">
      <button class="no" id="cp-no">취소</button>
      <button class="ok" id="cp-ok">등록</button>
    </div>
  </div>`;
  document.getElementById("cp-no").onclick = chatReset;
  checkConflicts(items);
  document.getElementById("cp-ok").onclick = async () => {
    for (const it of pendingItems) {
      if (it.kind === "event") {
        await apiFetch("/api/events", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: it.title, start: it.start, end: it.end, rrule: it.rrule ?? null, allday: it.allday ? 1 : 0 }),
        });
      } else if (it.kind === "task") {
        await apiFetch("/api/tasks", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: it.title, due: it.due ?? null }),
        });
      }
    }
    chatReset();
    loadDay(viewDate);
  };
}

// 같은 시간대에 이미 일정이 있으면 경고만 하고 막지는 않는다.
// 반복 일정은 첫 회차 기준으로만 확인한다.
async function checkConflicts(items) {
  const warnsEl = document.getElementById("cp-warns");
  const msgs = [];
  for (const it of items) {
    if (it.kind !== "event") continue;
    try {
      const j = await (await fetch(
        `/api/conflicts?start=${encodeURIComponent(it.start)}&end=${encodeURIComponent(it.end)}`)).json();
      for (const c of j.conflicts ?? []) {
        const s = new Date(c.start);
        msgs.push(`⚠ 그 시간에 ${fmtTime(s)} '${c.title}'${c.recurring ? "(반복)" : ""}이 있어요. 그래도 넣을까요?`);
      }
    } catch { /* 확인 실패 시 경고 생략 */ }
  }
  if (warnsEl && msgs.length) {
    warnsEl.innerHTML = [...new Set(msgs)].map(m => `<div class="cp-warn">${m}</div>`).join("");
  }
}

function renderQuestion(ask) {
  chatPanel.innerHTML = `<div class="cp-card">
    <div class="cp-question">${ask}</div>
    <div class="cp-btns"><button class="no" id="cp-no">취소</button></div>
  </div>`;
  document.getElementById("cp-no").onclick = chatReset;
  chatInput.focus();
}

// 정규식이 못 알아들은 경우 — 다시 입력하도록 안내 (입력값은 그대로 둠)
function renderUnparsed() {
  chatHistory = [];
  pendingItems = null;
  chatPanel.innerHTML = `<div class="cp-card">
    <div class="cp-question">잘 못 알아들었어요 😅 조금 바꿔서 다시 말해 주세요.</div>
    <div class="cp-help">이렇게 써보세요<br>· 내일 저녁 7시 헬스<br>· 매주 화목 아침 7시 운동<br>· 수학 숙제 금요일까지</div>
    <div class="cp-btns"><button class="no" id="cp-no">닫기</button></div>
  </div>`;
  document.getElementById("cp-no").onclick = chatReset;
  chatInput.focus();
  chatInput.select();
}

chatForm.addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatSend.disabled = true;
  chatPanel.innerHTML = `<div class="cp-loading">해석하는 중…</div>`;
  try {
    const res = await apiFetch("/api/parse", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, history: chatHistory }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error ?? "파싱 실패");
    const q = j.items.find(it => it.kind === "question");
    const unparsed = j.items.find(it => it.kind === "unparsed");
    if (unparsed) {
      renderUnparsed();          // 못 알아들음 → 재입력 안내 (입력값은 남겨둠)
    } else if (q) {
      chatInput.value = "";
      chatHistory.push({ role: "user", text }, { role: "assistant", text: q.ask });
      renderQuestion(q.ask);
    } else {
      chatInput.value = "";
      chatHistory = [];
      renderConfirm(j.items.filter(it => it.kind !== "question"));
    }
  } catch (e) {
    chatPanel.innerHTML = `<div class="cp-card"><div class="cp-error">${e.message}</div>
      <div class="cp-btns"><button class="no" id="cp-no">닫기</button></div></div>`;
    document.getElementById("cp-no").onclick = chatReset;
  } finally {
    chatSend.disabled = false;
  }
});

// ───────── 수정/삭제 바텀시트 ─────────
const modalEl = document.getElementById("modal");
const sheetEl = document.getElementById("sheet");
function showSheet(html) { sheetEl.innerHTML = html; modalEl.hidden = false; }
function closeSheet() { modalEl.hidden = true; sheetEl.innerHTML = ""; }
modalEl.addEventListener("click", e => { if (e.target === modalEl) closeSheet(); });

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function addDayStr(ds) {
  const [y, m, d] = ds.split("-").map(Number);
  const dt = new Date(y, m - 1, d + 1);
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
}

async function openEventEditor(eventId, occurrenceDate) {
  const res = await apiFetch(`/api/events/${eventId}`);
  if (!res.ok) return;
  const ev = await res.json();               // 원본(반복 규칙 포함) 기준으로 수정
  const recurring = !!ev.rrule;
  const allday = !!ev.allday;
  const sDate = ev.start.slice(0, 10);
  const sTime = ev.start.slice(11, 16);
  const eTime = ev.end.slice(11, 16);

  let body = `<div class="sheet-title">일정 수정</div>
    <label class="fld"><span>제목</span><input id="m-title" value="${escapeAttr(ev.title)}"></label>`;
  if (allday) {
    body += `<div class="fld-note">📅 종일 일정</div>
      <label class="fld"><span>날짜</span><input id="m-date" type="date" value="${sDate}"></label>`;
  } else if (recurring) {
    body += `<div class="fld-note">🔁 ${fmtRrule(ev.rrule)}</div>`;
  } else {
    body += `<label class="fld"><span>날짜</span><input id="m-date" type="date" value="${sDate}"></label>`;
  }
  if (!allday) body += `<div class="two">
      <label class="fld"><span>시작</span><input id="m-start" type="time" value="${sTime}"></label>
      <label class="fld"><span>종료</span><input id="m-end" type="time" value="${eTime}"></label>
    </div>`;
  body += `<div class="sheet-btns">
      <button class="ok" id="m-save">저장</button>
      ${recurring ? `<button class="no" id="m-skip">이 날짜만 빼기</button>` : ""}
      <button class="del" id="m-del">${recurring ? "반복 전체 삭제" : "삭제"}</button>
      <button class="no" id="m-cancel">취소</button>
    </div>`;
  showSheet(body);

  document.getElementById("m-cancel").onclick = closeSheet;
  document.getElementById("m-save").onclick = async () => {
    const title = document.getElementById("m-title").value.trim();
    if (!title) return;
    let payload;
    if (allday) {
      const d = document.getElementById("m-date").value;
      if (!d) return;
      payload = { title, start: `${d}T04:00`, end: `${addDayStr(d)}T03:59`, rrule: ev.rrule || null, allday: 1 };
    } else {
      const st = document.getElementById("m-start").value;
      const et = document.getElementById("m-end").value;
      if (!st || !et) return;
      const baseDate = recurring ? sDate : document.getElementById("m-date").value;
      const endDate = et <= st ? addDayStr(baseDate) : baseDate; // 자정 넘기면 종료는 다음날
      payload = { title, start: `${baseDate}T${st}`, end: `${endDate}T${et}`, rrule: ev.rrule || null, allday: 0 };
    }
    await apiFetch(`/api/events/${eventId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    closeSheet(); loadDay(viewDate);
  };
  if (recurring) document.getElementById("m-skip").onclick = async () => {
    await apiFetch(`/api/events/${eventId}/exceptions`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: occurrenceDate, kind: "skip" }),
    });
    closeSheet(); loadDay(viewDate);
  };
  document.getElementById("m-del").onclick = async () => {
    if (!confirm(recurring ? "이 반복 일정을 전부 삭제할까요?" : "이 일정을 삭제할까요?")) return;
    await apiFetch(`/api/events/${eventId}`, { method: "DELETE" });
    closeSheet(); loadDay(viewDate);
  };
}

function openTaskEditor(task) {
  if (!task) return;
  // "언제 할지"를 정해 두는 칸. 마감(언제까지)과 다르다 — 이게 있어야 실제로 하게 된다.
  const planDate = task.plan_at ? task.plan_at.slice(0, 10) : viewDate;
  const planTime = task.plan_at ? task.plan_at.slice(11, 16) : "";
  showSheet(`<div class="sheet-title">할 일 수정</div>
    <label class="fld"><span>제목</span><input id="m-title" value="${escapeAttr(task.title)}"></label>
    <label class="fld"><span>마감일 (없으면 비워두기)</span><input id="m-due" type="date" value="${task.due || ""}"></label>
    <div class="two">
      <label class="fld"><span>언제 할지 — 날짜</span><input id="m-plan-date" type="date" value="${planDate}"></label>
      <label class="fld"><span>시각</span><input id="m-plan-time" type="time" value="${planTime}"></label>
    </div>
    <div class="cp-help">시각을 넣으면 시간표에 옅은 블록으로 뜨고, 비우면 계획을 지웁니다.</div>
    ${task.spent_min ? `<div class="fld-note">⏱ 지금까지 ${task.spent_min}분 집중</div>` : ""}
    <div class="sheet-btns">
      <button class="ok" id="m-save">저장</button>
      <button class="del" id="m-del">삭제</button>
      <button class="no" id="m-cancel">취소</button>
    </div>`);
  document.getElementById("m-cancel").onclick = closeSheet;
  document.getElementById("m-save").onclick = async () => {
    const title = document.getElementById("m-title").value.trim();
    if (!title) return;
    const due = document.getElementById("m-due").value || null;
    const pd = document.getElementById("m-plan-date").value;
    const pt = document.getElementById("m-plan-time").value;
    await apiFetch(`/api/tasks/${task.id}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, due, plan_at: pd && pt ? `${pd}T${pt}` : null }),
    });
    closeSheet(); loadDay(viewDate);
  };
  document.getElementById("m-del").onclick = async () => {
    if (!confirm("이 할 일을 삭제할까요?")) return;
    await apiFetch(`/api/tasks/${task.id}`, { method: "DELETE" });
    closeSheet(); loadDay(viewDate);
  };
}

// ───────── 하루 닫기 ─────────
// 종이 플래너에서 저녁에 페이지를 보며 줄을 긋고, 못 한 건 손으로 다시 쓰는 그 의식.
// 남은 것마다 "내일로 / 이번 주 안에 / 버림 / 그대로"를 고르게 해서 밀린 목록이 무한히 자라지 않게 한다.
const MOOD_EMOJI = ["😖", "😕", "😐", "🙂", "😄"];
async function openCloseDay() {
  const r = await apiFetch(`/api/review?date=${viewDate}`);
  if (!r.ok) return;
  const rv = await r.json();
  const left = rv.tasks.filter(t => !t.done);
  const pct = rv.planned ? Math.round((rv.done / rv.planned) * 100) : null;
  const o = dateObj(viewDate);

  const head = `<div class="rv-head">
    ${o.getMonth() + 1}월 ${o.getDate()}일 · 계획 ${rv.planned}개 중 <b>${rv.done}개</b>${pct == null ? "" : ` (${pct}%)`}
    ${rv.starPlanned ? ` · ⭐ 핵심 ${rv.starDone}/${rv.starPlanned}` : ""}
  </div>`;

  const acts = id => `<div class="rv-acts" data-id="${id}">
      <button data-a="keep" class="on">그대로</button>
      <button data-a="tomorrow">내일로</button>
      <button data-a="week">이번 주 안에</button>
      <button data-a="drop" class="drop">버림</button>
    </div>`;
  const items = left.length
    ? left.map(t => `<div class="rv-item">
        <div class="t">${t.star_date === viewDate ? `<span class="star">★</span> ` : ""}${esc(t.title)}</div>
        ${acts(t.id)}</div>`).join("")
    : `<div class="fld-note">남은 할 일 없음. 깔끔하네요.</div>`;

  showSheet(`<div class="sheet-title">하루 닫기</div>${head}${items}
    <textarea class="rv-note" id="rv-note" placeholder="오늘 하루, 스스로에게 한 줄">${
      rv.log?.note ? esc(rv.log.note) : ""}</textarea>
    <div class="rv-moods" id="rv-moods">${
      MOOD_EMOJI.map((e, i) => `<button data-m="${i + 1}"${rv.log?.mood === i + 1 ? ' class="on"' : ""}>${e}</button>`).join("")}</div>
    <div class="sheet-btns">
      <button class="ok" id="rv-save">닫기</button>
      <button class="no" id="rv-cancel">취소</button>
    </div>`);

  // 항목별 선택 (한 줄에서 하나만)
  sheetEl.querySelectorAll(".rv-acts").forEach(g => g.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    g.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  }));
  let mood = rv.log?.mood ?? null;
  document.getElementById("rv-moods").addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    const same = b.classList.contains("on");
    sheetEl.querySelectorAll("#rv-moods button").forEach(x => x.classList.remove("on"));
    if (!same) { b.classList.add("on"); mood = Number(b.dataset.m); } else mood = null;
  });

  document.getElementById("rv-cancel").onclick = closeSheet;
  document.getElementById("rv-save").onclick = async () => {
    const actions = [...sheetEl.querySelectorAll(".rv-acts")].map(g => ({
      id: Number(g.dataset.id),
      action: g.querySelector("button.on")?.dataset.a ?? "keep",
    })).filter(a => a.action !== "keep");
    await apiFetch("/api/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: viewDate, note: document.getElementById("rv-note").value, mood, actions }),
    });
    closeSheet();
    loadDay(viewDate);
  };
}

function renderGoals() {
  const rows = goals.map(g => `<div class="goal${g.done ? " done" : ""}" data-id="${g.id}" data-done="${g.done ? 1 : 0}">
    <div class="box">${g.done ? "✓" : ""}</div><div class="name">${esc(g.title)}</div><div class="x">✕</div></div>`);
  if (goals.length < 3) rows.push(`<button class="goal-add" id="goal-add">＋ 이번 주 목표 추가</button>`);
  goalsEl.innerHTML = rows.join("");
}
goalsEl.addEventListener("click", async ev => {
  if (ev.target.closest("#goal-add")) {
    const title = prompt("이번 주에 이루고 싶은 것 하나:");
    if (!title?.trim()) return;
    await apiFetch("/api/goals", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: title.trim(), date: viewDate }),
    });
    return loadDay(viewDate);
  }
  const row = ev.target.closest(".goal");
  if (!row) return;
  const id = Number(row.dataset.id);
  if (ev.target.closest(".x")) {
    if (!confirm("이 목표를 지울까요?")) return;
    await apiFetch(`/api/goals/${id}`, { method: "DELETE" });
    return loadDay(viewDate);
  }
  const willDone = row.dataset.done !== "1";
  row.dataset.done = willDone ? "1" : "0";
  row.classList.toggle("done", willDone);
  row.querySelector(".box").textContent = willDone ? "✓" : "";
  const g = goals.find(x => x.id === id);
  if (g) g.done = willDone ? 1 : 0;
  apiFetch(`/api/goals/${id}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ done: willDone }),
  }).catch(() => {});
});

// 서비스워커 등록 — 홈 화면 설치 + 오프라인 껍데기
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(e => console.warn("SW 등록 실패:", e));
}
</script>
